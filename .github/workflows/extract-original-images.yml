name: Extract original HTML images

on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract-original-images.mjs'
      - '.github/workflows/extract-original-images.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract embedded original images
        run: node scripts/extract-original-images.mjs
      - name: Commit extracted real image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets *.html css/style.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: extract original HTML images to real WebP assets [skip ci]"
            git push origin main
          fi
